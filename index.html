<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mindbox</title>
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Pixel theme: cream page, square pixel borders (box-shadow with notched corners), hard drop shadows, pixel font for headings and buttons */
:root{
  --cream:#F6F1E7;--card:#FFFDF8;--sand:#EADBC4;--brown:#7A5C3E;--green:#1F3D2B;--line:#D9C9B0;
  --leaf:#91DE99;--leaf-d:#4FA35C;--drop:#CDB894;
  --pixel:'Pixelify Sans','IBM Plex Sans Thai',sans-serif;
  /* 3px and 2px pixel borders: four offset shadows leave the corners notched */
  --bd:0 -3px 0 0 var(--green),0 3px 0 0 var(--green),-3px 0 0 0 var(--green),3px 0 0 0 var(--green);
  --bd2:0 -2px 0 0 var(--green),0 2px 0 0 var(--green),-2px 0 0 0 var(--green),2px 0 0 0 var(--green);
}
*{box-sizing:border-box}
body{margin:0;color:var(--green);font-family:'IBM Plex Sans Thai',sans-serif;min-height:100vh;background-color:var(--cream);
  background-image:linear-gradient(rgba(31,61,43,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(31,61,43,.035) 1px,transparent 1px);background-size:16px 16px}
/* Section label with a pixel square bullet */
.label{font-family:var(--pixel);font-weight:700;font-size:15px;color:var(--green);display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.label::before{content:"";width:8px;height:8px;background:var(--leaf-d);box-shadow:2px 2px 0 0 var(--green);flex:none}
/* Item stripe and tag use the type colour (--tc) */
li.item{position:relative;padding-left:22px}
li.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--tc,var(--sand));box-shadow:2px 0 0 0 var(--green)}
.tag{display:inline-block;padding:0 6px;background:var(--tc,var(--sand));color:var(--green);box-shadow:0 0 0 1px var(--green)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 8px;text-align:center;color:var(--brown);font-size:14px}
.empty .sprite{image-rendering:pixelated}
.card.empty .text{color:var(--green);font-family:var(--pixel)}
.prog{display:flex;gap:3px;margin-top:8px;padding:2px;width:max-content;max-width:100%}
.prog i{width:18px;height:10px;background:var(--line)}
.prog i.on{background:var(--leaf-d)}
#syncBtn[data-state=ok]{background:var(--leaf);box-shadow:var(--bd),0 6px 0 0 var(--leaf-d)}
#syncBtn[data-state=wait]{background:var(--sand)}
#syncBtn[data-state=err]{background:#F8B9C6}
/* Type picker in the capture box: one scrollable row so it stays short */
.chips.capTypes{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:2px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chips.capTypes .chip{flex:none;min-height:40px;padding:0 10px;font-size:14px;white-space:nowrap}
/* Search */
input.search{margin-top:4px}
mark{background:var(--leaf);color:var(--green);padding:0 1px}
/* Edit / delete */
li.item .t{padding-right:46px}
li.item .ib{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;background:var(--card);color:var(--green);font-size:18px;line-height:1;box-shadow:var(--bd2)}
li.item .ib:active{background:var(--leaf)}
li.item.editing{background:var(--card)}
textarea.edit{width:100%;font-size:16px;line-height:1.5;background:var(--cream);padding:8px 10px;margin:2px 0 12px;min-height:84px;resize:vertical;outline:none;box-shadow:var(--bd2)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.btn.danger{background:#F8B9C6;box-shadow:var(--bd),0 6px 0 0 #C9788A}
.btn.danger:active{box-shadow:var(--bd),0 3px 0 0 #C9788A}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;z-index:10;background:var(--green);color:var(--cream);padding:6px 8px 6px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--pixel)}
.toast .btn{margin:3px 3px 6px}
.app{max-width:480px;margin:0 auto;padding:20px 16px 104px;display:flex;flex-direction:column;gap:16px}
header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1,h2{font-family:var(--pixel);font-weight:700;letter-spacing:.5px}
h1{margin:0;font-size:24px;display:flex;align-items:center;gap:8px;min-width:0}
h1 .logo{width:30px;height:30px;display:block;flex:none;box-shadow:var(--bd2)}
header .row{gap:6px;flex:none}
header .btn{min-height:40px;padding:0 10px;font-size:13px;white-space:nowrap;margin:3px 3px 6px}
#pendingBadge{white-space:nowrap;font-size:12px}
/* Small phones: the banner already shows the pending count */
@media (max-width:370px){#pendingBadge{display:none}h1{font-size:21px}}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--green);outline-offset:5px}
.btn{min-height:44px;border:0;border-radius:0;background:var(--leaf);color:var(--green);padding:0 16px;font-family:var(--pixel);font-weight:700;font-size:15px;margin:3px 3px 6px;
  box-shadow:var(--bd),0 6px 0 0 var(--leaf-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:var(--bd),0 3px 0 0 var(--leaf-d)}
.btn.ghost{background:var(--card);box-shadow:var(--bd),0 6px 0 0 var(--drop)}
.btn.ghost:active{box-shadow:var(--bd),0 3px 0 0 var(--drop)}
.muted{font-size:13px;color:var(--brown)}
.capture{background:var(--card);margin:3px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--bd),0 7px 0 0 var(--drop)}
.capture label{font-family:var(--pixel)}
textarea,input.text{font:inherit;color:var(--green)}
textarea{border:0;outline:none;resize:none;background:transparent;font-size:16px;min-height:72px}
input.text{width:100%;min-height:44px;border:0;border-radius:0;padding:0 12px;background:var(--card);margin:2px;box-shadow:var(--bd2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.tile{min-height:72px;border:0;border-radius:0;background:var(--card);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--green);box-shadow:var(--bd2)}
.tile .e{font-size:22px}
.tile .c{color:var(--brown);font-family:var(--pixel);font-size:13px}
.tile.add{background:transparent;box-shadow:none;border:3px dashed var(--green);font-family:var(--pixel);font-size:13px}
.tile.add .e{font-family:var(--pixel);line-height:1}
.tile.pic{background:transparent;box-shadow:none;min-height:0;padding:0;gap:4px}
.tile .ti{width:100%;max-width:76px;aspect-ratio:1;border-radius:22%;display:block}
.tile.pic.sel .ti{outline:3px solid var(--green);outline-offset:3px;border-radius:22%}
.tile .nm{font-size:12px;line-height:1.2;text-align:center;word-break:break-word}
.recapBar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;padding:12px 16px 8px;background:var(--cream)}
.banner{background:var(--sand);margin:2px;padding:12px;font-size:14px;box-shadow:var(--bd2)}
ul{list-style:none;margin:0;padding:0}
li.item{background:var(--card);padding:12px 12px 12px 24px;margin:2px 2px 14px;box-shadow:var(--bd2),0 4px 0 0 var(--drop)}
li.item .t{font-size:15px;white-space:pre-wrap;word-break:break-word}
li.item .m{font-size:12px;color:var(--brown);margin-top:4px}
li.muted{padding:4px 2px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--green);display:flex;justify-content:space-around;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.bottom button{background:none;border:0;color:var(--green);min-height:44px;flex:1;max-width:140px;font-family:var(--pixel);font-size:15px}
nav.bottom button.on{background:var(--leaf);font-weight:700;box-shadow:var(--bd2)}
.hidden{display:none!important}
.card{background:var(--card);margin:3px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--bd),0 7px 0 0 var(--drop)}
.card .text{font-size:18px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:12px 10px;padding:2px}
.chip{min-height:44px;border:0;border-radius:0;background:var(--card);padding:0 12px;color:var(--green);font:inherit;box-shadow:var(--bd2)}
.chip.on{background:var(--leaf);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions .btn{min-height:52px;margin:3px 3px 6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><img class="logo" src="icon-192.png" alt="">Mindbox</h1>
    <div class="row" style="justify-content:flex-end">
      <span class="muted" id="pendingBadge"></span>
      <button class="btn ghost" style="min-height:40px" id="syncBtn" type="button">ซิงก์</button>
      <button class="btn ghost" style="min-height:40px;padding:0 10px" id="settingsBtn" type="button" aria-label="ตั้งค่า">⚙️</button>
    </div>
  </header>
  <div class="banner hidden" id="syncError" role="alert"></div>

  <section id="viewHome">
    <div class="capture">
      <label class="label" for="cap">จดไว้ก่อน</label>
      <textarea id="cap" rows="3" placeholder="จดอะไรก็ได้ เดี๋ยวค่อยแยกทีหลัง..."></textarea>
      <div class="muted">รู้ประเภทแล้ว? เลือกได้เลย (ไม่เลือกก็ได้)</div>
      <div class="chips capTypes" id="capTypes" role="group" aria-label="ประเภทของโน้ตนี้"></div>
      <div class="row">
        <span class="muted">Enter ขึ้นบรรทัดใหม่ · กดบันทึกเมื่อจดเสร็จ</span>
        <button class="btn" id="save" type="button">บันทึก</button>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <input class="text search" id="q" type="search" placeholder="🔍 ค้นหาโน้ต..." aria-label="ค้นหาโน้ต" autocomplete="off">
    <div class="label" id="listLabel" style="margin-top:6px">ล่าสุด</div>
    <ul id="homeList"></ul>
  </section>

  <section id="viewType" class="hidden">
    <h2 style="margin:0 0 12px;font-size:20px">ตามประเภท</h2>
    <div class="tiles" id="tiles"></div>
    <div id="typeTitle" class="label" style="margin:22px 0 10px"></div>
    <ul id="typeList"></ul>
  </section>

  <section id="viewRecap" class="hidden" style="padding-bottom:150px">
    <h2 style="margin:0 0 6px;font-size:20px">รีแคปวันเสาร์</h2>
    <div class="muted" id="recapSummary"></div>
    <div class="muted" id="recapProgress" style="margin:8px 0 12px"></div>
    <div id="recapCard"></div>
    <div class="recapBar hidden" id="recapBar">
      <div class="actions" id="recapActions"></div>
      <div class="muted" style="text-align:center;font-size:12px;margin-top:8px">บันทึกลง Google Sheets เมื่อกดแล้ว</div>
    </div>
  </section>

  <section id="viewSettings" class="hidden">
    <h2 style="margin:0 0 10px;font-size:20px">ตั้งค่า</h2>
    <label class="muted" for="scriptUrl">Apps Script URL (วาง URL จากขั้น Deploy)</label>
    <input class="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="row" style="margin-top:10px;justify-content:flex-start;flex-wrap:wrap">
      <button class="btn ghost" id="testConn" type="button">ทดสอบการเชื่อมต่อ</button>
      <button class="btn" id="saveSettings" type="button">บันทึก URL</button>
    </div>
    <div class="muted" id="testResult" role="status" style="margin-top:8px"></div>
    <div class="row" style="margin-top:10px;justify-content:flex-start;flex-wrap:wrap">
      <button class="btn ghost" id="resendAll" type="button">ส่งทั้งหมดอีกครั้ง</button>
      <button class="btn ghost" id="exportCsv" type="button">ส่งออก CSV</button>
    </div>
    <div class="label" style="margin:20px 0 6px">เพิ่มประเภท</div>
    <div class="row">
      <input class="text" id="newEmoji" placeholder="อิโมจิ" style="max-width:90px">
      <input class="text" id="newName" placeholder="ชื่อประเภท">
      <button class="btn" id="addType" type="button">เพิ่ม</button>
    </div>
  </section>
</div>

<nav class="bottom">
  <button type="button" data-view="home" class="on">Inbox</button>
  <button type="button" data-view="type">ตามประเภท</button>
  <button type="button" data-view="recap">รีแคป</button>
</nav>
<div class="toast hidden" id="toast" role="status">
  <span id="toastText"></span>
  <button class="btn sm" type="button" id="undoBtn">เลิกทำ</button>
</div>

<script>
const KEY = { items: 'mb_items', types: 'mb_types', queue: 'mb_queue', url: 'mb_url' };
const DEFAULT_TYPES = [
  { id: 'ideas', emoji: '💡', name: 'Ideas' },
  { id: 'recipes', emoji: '🍳', name: 'Recipes' },
  { id: 'quotes', emoji: '💬', name: 'Quotes' },
  { id: 'stories', emoji: '✨', name: 'Good Stories' },
  { id: 'main', emoji: '💼', name: 'Main Work' },
  { id: 'freelance', emoji: '🧑‍💻', name: 'Freelance' },
  { id: 'business', emoji: '🏪', name: 'Business' }
];
// Pixel icons for the built-in types (icons/<file>.png). Types the user adds keep their emoji.
const TYPE_ICONS = { ideas: 'ideas', recipes: 'recipes', quotes: 'quotes', stories: 'good_stories', main: 'main_work', freelance: 'freelance', business: 'business' };
const STATUS_LABEL ={ inbox: 'Inbox', doing: 'กำลังทำ', later: 'เก็บไว้' };
const RECAP_ACTIONS = [
  { label: 'ทำ', status: 'doing', cls: 'btn' },
  { label: 'เก็บไว้', status: 'later', cls: 'btn ghost' },
  { label: 'ทิ้ง', status: 'trash', cls: 'btn ghost' }
];

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = iso => new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

let items = load(KEY.items, []);
let types = load(KEY.types, DEFAULT_TYPES);
let queue = load(KEY.queue, []);
let currentType = null;
let recapIds = [];
let recapIdx = 0;

const typeOf = id => types.find(t => t.id === id);
const typeLabel = id => { const t = typeOf(id); return t ? `${t.emoji} ${t.name}` : 'ยังไม่แยกประเภท'; };
const activeItems = () => items.filter(i => i.status !== 'trash');
const unsortedItems = () => activeItems().filter(i => !i.type);

function persist() {
  store(KEY.items, items);
  store(KEY.types, types);
  store(KEY.queue, queue);
  render();
  flush();
}

function changeItem(item, changes) {
  Object.assign(item, changes, { updatedAt: new Date().toISOString() });
  queue.push({ ...item });
  persist();
}

// Stripe and tag colour per type, taken from each pixel icon's background
const TYPE_COLORS = { ideas: '#D3BDF5', recipes: '#F7CF6A', quotes: '#F8B9C6', stories: '#B4E8C2', main: '#9CCBF6', freelance: '#F7BE96', business: '#8ED68E' };
const typeColor = id => (id && (TYPE_COLORS[id] || '#D6D0F0')) || 'var(--sand)';

// A small pixel box (the "mind box") for empty screens
const EMPTY_ART = `<svg class="sprite" viewBox="0 0 16 14" width="64" height="56" shape-rendering="crispEdges" aria-hidden="true">
  <rect x="2" y="5" width="12" height="8" fill="#1F3D2B"/><rect x="3" y="6" width="10" height="6" fill="#FFFDF8"/>
  <rect x="1" y="3" width="14" height="3" fill="#1F3D2B"/><rect x="2" y="4" width="12" height="1" fill="#91DE99"/>
  <rect x="6" y="8" width="1" height="1" fill="#1F3D2B"/><rect x="9" y="8" width="1" height="1" fill="#1F3D2B"/>
  <rect x="7" y="10" width="2" height="1" fill="#1F3D2B"/>
  <rect x="12" y="0" width="1" height="1" fill="#4FA35C"/><rect x="11" y="1" width="3" height="1" fill="#4FA35C"/><rect x="12" y="2" width="1" height="1" fill="#4FA35C"/>
</svg>`;
const emptyHtml = msg => `<li class="empty">${EMPTY_ART}<span>${msg}</span></li>`;

// The card being edited (only one at a time) and whether its delete button is armed
let editingId = null;
let deleteArmed = false;

function itemHtml(i, showMeta = true, q = '') {
  const head = `<li class="item${i.id === editingId ? ' editing' : ''}" style="--tc:${typeColor(i.type)}" data-id="${esc(i.id)}">`;
  if (i.id === editingId) {
    return head +
      `<textarea class="edit" rows="3" aria-label="แก้ข้อความ">${esc(i.text)}</textarea>` +
      `<div class="row">` +
      `<button class="btn sm danger" type="button" data-act="del">${deleteArmed ? 'แน่ใจ? กดอีกครั้ง' : 'ลบ'}</button>` +
      `<span class="row" style="gap:6px"><button class="btn sm ghost" type="button" data-act="cancel">ยกเลิก</button>` +
      `<button class="btn sm" type="button" data-act="save">บันทึก</button></span>` +
      `</div></li>`;
  }
  const meta = showMeta
    ? `${fmt(i.createdAt)} · <span class="tag">${esc(typeLabel(i.type))}</span> · ${STATUS_LABEL[i.status] || ''}`
    : fmt(i.createdAt);
  return head + `<div class="t">${highlight(i.text, q)}</div><div class="m">${meta}</div>` +
    `<button class="ib" type="button" data-act="edit" aria-label="แก้ไขหรือลบ">✎</button></li>`;
}

function setSync(text, state) {
  $('syncBtn').textContent = text;
  $('syncBtn').dataset.state = state;
}

function render() {
  const active = activeItems();
  const unsorted = unsortedItems().length;
  $('pendingBadge').textContent = `รอจัด ${unsorted}`;
  $('banner').textContent = unsorted
    ? `มี ${unsorted} รายการยังไม่แยกประเภท · รีแคปวันเสาร์ 19:00`
    : 'ทุกรายการถูกแยกประเภทแล้ว';
  $('tiles').innerHTML = types.map(t => {
    const n = active.filter(i => i.type === t.id).length;
    const icon = TYPE_ICONS[t.id];
    const sel = t.id === currentType ? ' sel' : '';
    // Built-in icons already show the type name, so their label is only for screen readers.
    // Types the user adds get the "New" icon with their name underneath.
    return icon
      ? `<button class="tile pic${sel}" type="button" data-type="${esc(t.id)}" aria-label="${esc(t.name)} ${n} รายการ"><img class="ti" src="icons/${icon}.png" alt=""><span class="c">${n}</span></button>`
      : `<button class="tile pic${sel}" type="button" data-type="${esc(t.id)}" aria-label="${esc(t.name)} ${n} รายการ"><img class="ti" src="icons/add.png" alt=""><span class="nm">${esc(t.name)}</span><span class="c">${n}</span></button>`;
  }).join('') + `<button class="tile add" type="button" data-add="1"><span class="e">+</span>เพิ่ม</button>`;
  renderCapTypes();
  renderHomeList();
  if (!$('viewType').classList.contains('hidden')) renderType();
}

function renderType() {
  if (!typeOf(currentType)) currentType = types[0] ? types[0].id : null;
  document.querySelectorAll('#tiles [data-type]').forEach(b => b.classList.toggle('sel', b.dataset.type === currentType));
  const t = typeOf(currentType);
  $('typeTitle').textContent = t ? `${t.emoji} ${t.name}` : '';
  const list = activeItems().filter(i => i.type === currentType);
  $('typeList').innerHTML = list.length
    ? list.map(i => itemHtml(i, false)).join('')
    : emptyHtml('ยังไม่มีรายการในประเภทนี้');
}

function renderRecap() {
  const unsorted = unsortedItems();
  const counts = {};
  unsorted.forEach(i => { const k = i.type || 'other'; counts[k] = (counts[k] || 0) + 1; });
  const parts = Object.keys(counts).map(k => (k === 'other' ? 'อื่นๆ' : typeOf(k).emoji) + ` ${counts[k]}`);
  $('recapSummary').textContent = `เสาร์ 19:00 · ยังไม่แยก ${unsorted.length} รายการ${parts.length ? ': ' + parts.join(' · ') : ''}`;

  const current = items.find(i => i.id === recapIds[recapIdx]);
  if (!recapIds.length || !current || current.status === 'trash') {
    $('recapProgress').textContent = '';
    $('recapCard').innerHTML = `<div class="card empty">${EMPTY_ART}<div class="text">เคลียร์หมดแล้ว!</div><span>ไม่มีรายการรอจัดประเภท</span></div>`;
    $('recapActions').innerHTML = '';
    $('recapBar').classList.add('hidden');
    return;
  }
  $('recapBar').classList.remove('hidden');
  // 10-segment pixel bar: how far through this week's recap you are
  const filled = Math.round((recapIdx / recapIds.length) * 10);
  $('recapProgress').innerHTML = `รายการที่ ${recapIdx + 1} จาก ${recapIds.length}` +
    `<span class="prog" aria-hidden="true">${Array.from({ length: 10 }, (_, k) => `<i${k < filled ? ' class="on"' : ''}></i>`).join('')}</span>`;
  $('recapCard').innerHTML = `<div class="card">
    <div class="text">${esc(current.text)}</div>
    <div class="muted">จดเมื่อ ${fmt(current.createdAt)}</div>
    <div class="muted" style="margin-top:6px">เลือกประเภท</div>
    <div class="chips">${types.map(t => `<button class="chip ${current.type === t.id ? 'on' : ''}" type="button" data-pick="${esc(t.id)}">${esc(t.emoji)} ${esc(t.name)}</button>`).join('')}</div>
  </div>`;
  $('recapActions').innerHTML = RECAP_ACTIONS.map(a => `<button class="${a.cls}" type="button" data-status="${a.status}">${a.label}</button>`).join('');
}

function openRecap() {
  recapIds = unsortedItems().map(i => i.id);
  recapIdx = 0;
  renderRecap();
}

function renderTypeSettingsAndAll() { render(); }

function setView(name) {
  ['viewHome', 'viewType', 'viewRecap', 'viewSettings'].forEach(id => $(id).classList.add('hidden'));
  const map = { home: 'viewHome', type: 'viewType', recap: 'viewRecap', settings: 'viewSettings' };
  $(map[name]).classList.remove('hidden');
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  if (name === 'home') render();
  if (name === 'type') renderType();
  if (name === 'recap') openRecap();
  if (name === 'settings') $('scriptUrl').value = localStorage.getItem(KEY.url) || '';
  window.scrollTo(0, 0);
}

// Sends ops and reads Apps Script's reply. Throws a Thai message that says what to fix.
async function send(url, ops) {
  let res, text;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ops })
    });
    text = (await res.text()).trim();
  } catch (e) {
    throw new Error('ส่งไม่ถึง Google · เช็คว่า URL ลงท้ายด้วย /exec และตั้ง Who has access เป็น Anyone');
  }
  if (res.ok && text === 'ok') return;
  if (/doPost/.test(text)) throw new Error('ไม่เจอ doPost · ใน Apps Script ให้ Deploy เป็น New version');
  if (/accounts\.google|<html/i.test(text)) throw new Error('Google ขอให้ล็อกอิน · ตั้ง Who has access เป็น Anyone แล้ว Deploy ใหม่');
  throw new Error('สคริปต์ตอบกลับผิดปกติ: ' + text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 120));
}

function showSyncError(msg) {
  $('syncError').textContent = msg ? `ซิงก์ไม่สำเร็จ · ${msg}` : '';
  $('syncError').classList.toggle('hidden', !msg);
}

let flushing = false;
async function flush() {
  const url = localStorage.getItem(KEY.url);
  if (!url || !queue.length || !navigator.onLine || flushing) {
    if (!url) setSync('ยังไม่ตั้งค่า', 'off');
    else setSync(queue.length ? `รอส่ง ${queue.length}` : 'ซิงก์แล้ว', queue.length ? 'wait' : 'ok');
    return;
  }
  flushing = true;
  setSync('กำลังส่ง...', 'wait');
  try {
    while (queue.length) {
      const batch = queue.slice(0, 50);
      await send(url, batch);
      queue = queue.slice(batch.length);
      store(KEY.queue, queue);
    }
    showSyncError('');
    setSync('ซิงก์แล้ว', 'ok');
  } catch (e) {
    showSyncError(e.message);
    setSync(`รอส่ง ${queue.length}`, 'err');
  } finally {
    flushing = false;
  }
}

// Two-way sync: pull every row from the sheet and merge it into this device.
// For an item both sides have, the newer updatedAt wins; an item with a change
// still waiting in this device's queue keeps the local version until it is sent.
function mergeRemote(remote) {
  const pending = new Set(queue.map(q => q.id));
  const byId = new Map(items.map(i => [i.id, i]));
  let changed = false;
  for (const r of remote) {
    const local = byId.get(r.id);
    if (!local) { items.push(r); changed = true; continue; }
    if (pending.has(r.id)) continue;
    if ((r.updatedAt || '') > (local.updatedAt || '')) { Object.assign(local, r); changed = true; }
  }
  if (changed) {
    items.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    store(KEY.items, items);
    if (!editingId) render(); // don't wipe a card the user is typing in
  }
  return changed;
}

let pulling = false;
async function pull() {
  const url = localStorage.getItem(KEY.url);
  if (!url || !navigator.onLine || pulling) return;
  pulling = true;
  try {
    let data;
    try {
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=list');
      data = await res.json();
    } catch (e) {
      throw new Error('ดึงข้อมูลจากชีตไม่ได้ · ถ้าเพิ่งแก้ Code.gs ให้ Deploy เป็น New version');
    }
    if (!data || !data.ok || !Array.isArray(data.items)) throw new Error('สคริปต์ตอบกลับไม่ใช่รายการโน้ต');
    mergeRemote(data.items);
  } finally {
    pulling = false;
  }
}

// Send this device's changes first, then pull everyone else's
async function syncAll() {
  await flush();
  if (!localStorage.getItem(KEY.url) || !navigator.onLine) return;
  try {
    await pull();
    if (!queue.length) { showSyncError(''); setSync('ซิงก์แล้ว', 'ok'); }
  } catch (e) {
    showSyncError(e.message);
    setSync('ดึงไม่ได้', 'err');
  }
}

async function testConnection() {
  const url = $('scriptUrl').value.trim();
  const out = $('testResult');
  if (!/\/exec$/.test(url)) { out.textContent = '❌ URL ต้องลงท้ายด้วย /exec'; return; }
  out.textContent = 'กำลังทดสอบ...';
  try {
    await send(url, []);
    out.textContent = '✅ เชื่อมต่อได้ · กด บันทึก URL แล้วลองจดหนึ่งรายการ';
  } catch (e) {
    out.textContent = '❌ ' + e.message;
  }
}

function resendAll() {
  queue = items.map(i => ({ ...i }));
  $('testResult').textContent = `ใส่ ${queue.length} รายการกลับเข้าคิวแล้ว กำลังส่ง...`;
  persist();
}

function exportCsv() {
  const head = ['id', 'text', 'type', 'status', 'createdAt', 'updatedAt'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = items.map(i => [i.id, i.text, i.type || '', i.status, i.createdAt, i.updatedAt].map(q).join(','));
  const blob = new Blob(['﻿' + [head.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mindbox-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Capture: optional type picked before saving (cleared after each save)
let capType = null;
function renderCapTypes() {
  $('capTypes').innerHTML = types.map(t =>
    `<button class="chip${capType === t.id ? ' on' : ''}" type="button" data-cap="${esc(t.id)}" aria-pressed="${capType === t.id}">${esc(t.emoji)} ${esc(t.name)}</button>`
  ).join('');
}
$('capTypes').addEventListener('click', e => {
  const b = e.target.closest('[data-cap]');
  if (!b) return;
  capType = capType === b.dataset.cap ? null : b.dataset.cap; // tap again to unselect
  renderCapTypes();
});

function saveCapture() {
  const text = $('cap').value.trim();
  if (!text) return;
  const now = new Date().toISOString();
  const item = { id: uid(), text, type: capType, status: 'inbox', createdAt: now, updatedAt: now };
  items.unshift(item);
  queue.push({ ...item });
  $('cap').value = '';
  capType = null;
  persist();
}
$('save').addEventListener('click', saveCapture);
// Enter makes a new line; Cmd/Ctrl+Enter is a keyboard shortcut for บันทึก on a computer
$('cap').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); saveCapture(); }
});

// Search: filters every note (not just the latest 20) by its text or type name
const norm = s => String(s).toLocaleLowerCase('th');
function highlight(text, q) {
  if (!q) return esc(text);
  const lower = norm(text), nq = norm(q);
  let out = '', i = 0, k;
  while ((k = lower.indexOf(nq, i)) !== -1) {
    out += esc(text.slice(i, k)) + '<mark>' + esc(text.slice(k, k + q.length)) + '</mark>';
    i = k + q.length;
  }
  return out + esc(text.slice(i));
}
function renderHomeList() {
  const q = $('q').value.trim();
  const active = activeItems();
  if (!q) {
    $('listLabel').textContent = 'ล่าสุด';
    $('homeList').innerHTML = active.length
      ? active.slice(0, 20).map(i => itemHtml(i)).join('')
      : emptyHtml('กล่องยังว่าง ลองจดอะไรสักอย่าง');
    return;
  }
  const nq = norm(q);
  const hits = active.filter(i => norm(i.text).includes(nq) || norm(typeLabel(i.type)).includes(nq));
  $('listLabel').textContent = `ผลการค้นหา ${hits.length} รายการ`;
  $('homeList').innerHTML = hits.length
    ? hits.map(i => itemHtml(i, true, q)).join('')
    : emptyHtml(`ไม่เจอโน้ตที่มีคำว่า "${esc(q)}"`);
}
$('q').addEventListener('input', renderHomeList);

// Edit / delete a card (Inbox and by-type lists share one handler)
let undoTimer = null;
function showUndo(item, prevStatus) {
  clearTimeout(undoTimer);
  $('toastText').textContent = 'ลบรายการแล้ว';
  $('toast').classList.remove('hidden');
  $('undoBtn').onclick = () => {
    changeItem(item, { status: prevStatus });
    $('toast').classList.add('hidden');
  };
  undoTimer = setTimeout(() => $('toast').classList.add('hidden'), 6000);
}

function focusEditor() {
  const ta = document.querySelector('section:not(.hidden) textarea.edit');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

function onListClick(e) {
  const btn = e.target.closest('[data-act]');
  const li = e.target.closest('li[data-id]');
  if (!btn || !li) return;
  const item = items.find(i => i.id === li.dataset.id);
  if (!item) return;
  const act = btn.dataset.act;
  if (act === 'edit') {
    editingId = item.id; deleteArmed = false; render(); focusEditor();
  } else if (act === 'cancel') {
    editingId = null; deleteArmed = false; render();
  } else if (act === 'save') {
    const text = li.querySelector('textarea.edit').value.trim();
    editingId = null; deleteArmed = false;
    if (text && text !== item.text) changeItem(item, { text }); // syncs the new text to the sheet
    else render();
  } else if (act === 'del') {
    if (!deleteArmed) { deleteArmed = true; render(); focusEditor(); return; }
    const prev = item.status;
    editingId = null; deleteArmed = false;
    changeItem(item, { status: 'trash' }); // the sheet row is kept with status "trash"
    showUndo(item, prev);
  }
}
function onListKey(e) {
  if (!e.target.matches('textarea.edit')) return;
  const li = e.target.closest('li[data-id]');
  if (e.key === 'Escape') li.querySelector('[data-act=cancel]').click();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); li.querySelector('[data-act=save]').click(); }
}
['homeList', 'typeList'].forEach(id => {
  $(id).addEventListener('click', onListClick);
  $(id).addEventListener('keydown', onListKey);
});

// Navigation
document.querySelectorAll('nav.bottom button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('tiles').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.add) { setView('settings'); return; }
  currentType = t.dataset.type;
  renderType();
});
$('settingsBtn').addEventListener('click', () => setView('settings'));

// Recap
$('recapCard').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (!b) return;
  const item = items.find(i => i.id === recapIds[recapIdx]);
  if (item) changeItem(item, { type: b.dataset.pick });
  renderRecap();
});
$('recapActions').addEventListener('click', e => {
  const b = e.target.closest('[data-status]');
  if (!b) return;
  const item = items.find(i => i.id === recapIds[recapIdx]);
  if (item) changeItem(item, { status: b.dataset.status });
  recapIdx++;
  renderRecap();
});

// Settings
$('saveSettings').addEventListener('click', () => {
  localStorage.setItem(KEY.url, $('scriptUrl').value.trim());
  syncAll();
  setView('home');
});
$('exportCsv').addEventListener('click', exportCsv);
$('testConn').addEventListener('click', testConnection);
$('resendAll').addEventListener('click', resendAll);
$('addType').addEventListener('click', () => {
  const name = $('newName').value.trim();
  const emoji = $('newEmoji').value.trim() || '🏷️';
  if (!name) return;
  types.push({ id: uid(), emoji, name });
  $('newName').value = '';
  $('newEmoji').value = '';
  persist();
});

$('syncBtn').addEventListener('click', syncAll);
window.addEventListener('online', syncAll);
// Pull again whenever the app comes back to the screen (e.g. switching from another app on the phone)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncAll(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}

render();
syncAll();
</script>
